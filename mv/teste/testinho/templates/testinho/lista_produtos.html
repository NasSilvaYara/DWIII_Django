<h1>Produtos</h1>
<a href="{% url 'criar_produto' %}">Novo produto</a>
<table border="1">
    <tr>
        <th>Nome</th>
        <th>Preço</th>
        <th>Quantidade</th>
        <th>Ações</th>
    </tr>
    {% for produto in produtos %}
    <tr>
        <td>{{ produto.nome }}</td>
        <td>{{ produto.preco }}</td>
        <td>{{ produto.quantidade }}</td>
        <td>
            <a href="{% url 'editar_produto' produto.pk %}">Editar</a>
            <a href="{% url 'excluir_produto' produto.pk %}">Excluir</a>
        </td>
    </tr>
    {% endfor %}
</table>
